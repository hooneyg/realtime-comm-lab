name: Docker Build & Push (CD)

# [DevOps Note]
# CI(빌드/테스트)가 완벽하게 통과된 후 동작하는 배포(CD) 파이프라인입니다.
# main 브랜치에 코드가 머지되면, 멀티 스테이지 Dockerfile을 기반으로 이미지를 빌드하고
# Docker Hub 레지스트리로 퍼블리시합니다.

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 🐳 Docker Hub 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 🔨 Docker Image Build 및 Push 실행
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # 태그 전략: latest와 git SHA를 동시에 부여하여 롤백을 용이하게 합니다.
        tags: |
          hooney/realtime-comm-lab:latest
          hooney/realtime-comm-lab:${{ github.sha }}
