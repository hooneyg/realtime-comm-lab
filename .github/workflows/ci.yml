name: CI Pipeline (Build & Test)

# [DevOps Note]
# 코드가 dev 또는 main 브랜치로 푸시될 때마다 자동으로 트리거되어,
# 코드 컴파일 및 단위/통합 테스트를 100% 무인으로 검증하는 CI 파이프라인입니다.

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 저장소 체크아웃
      uses: actions/checkout@v4

    - name: ☕ JDK 21 환경 세팅
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: 🚀 Gradle Build 및 Test 실행
      # gradlew 권한을 부여하고, 통합 테스트(EmbeddedRedis)를 포함한 빌드를 수행합니다.
      run: |
        chmod +x gradlew
        ./gradlew clean build

    - name: 📊 테스트 결과 리포트 저장 (Artifact)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/reports/tests/
